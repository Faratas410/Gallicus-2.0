name: Godot Smoke Runtime

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: lean
        type: choice
        options:
          - lean
          - full
  push:
    branches: [main]
    paths:
      - ".github/ci/full_suite_checkpoint.txt"
      - ".github/workflows/godot_smoke_runtime.yml"
      - "project.godot"
      - "scripts/systems/game_events.gd"
      - "scripts/systems/run_manager.gd"
      - "scripts/systems/save_manager.gd"
      - "scripts/systems/run/**"
      - "scripts/contracts/**"

env:
  GODOT_VERSION: "4.6.2-stable"
  GODOT_BIN_NAME: "Godot_v4.6.2-stable_linux.x86_64"
  GODOT_ZIP_NAME: "Godot_v4.6.2-stable_linux.x86_64.zip"
  GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"

jobs:
  static_contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run the canonical static playbook once
        run: |
          set -euo pipefail
          python3 scripts/ci/run_testing_playbook.py \
            --skip-import \
            --output-dir artifacts/static_contracts

      - name: Upload static diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static_contracts_logs
          path: artifacts/static_contracts
          if-no-files-found: ignore

  runtime_routes:
    needs: static_contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot 4.6.2 headless binary
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Prepare Linux tooling and Godot
        run: bash scripts/ci/bootstrap_linux_godot.sh

      - name: Import project assets once
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LOG_DIR=artifacts/runtime_routes
          mkdir -p "$LOG_DIR"
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit > "$LOG_DIR/import.log" 2>&1
          tail -n 200 "$LOG_DIR/import.log" || true

      - name: Run route bundle
        run: |
          set -uo pipefail
          PROFILE="${{ inputs.profile || 'lean' }}"
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LEAN_SCENARIOS=(ROUTE_CASHOUT ROUTE_DOUBLE ROUTE_CONDANNA ROUTE_REGISTER_FINAL)
          FULL_SCENARIOS=(BET_PRESENT FULL_RUN ROUTE_CASHOUT ROUTE_DOUBLE ROUTE_CONDANNA ROUTE_REGISTER_FINAL)
          if [ "$PROFILE" = "full" ]; then
            SCENARIOS=("${FULL_SCENARIOS[@]}")
          else
            SCENARIOS=("${LEAN_SCENARIOS[@]}")
          fi

          overall=0
          for scenario in "${SCENARIOS[@]}"; do
            LOG_DIR="artifacts/runtime_routes/$scenario"
            mkdir -p "$LOG_DIR"
            if [ "$scenario" = "BET_PRESENT" ]; then
              TIMEOUT_SEC=45
              HARD_TIMEOUT_SEC=60
            else
              TIMEOUT_SEC=60
              HARD_TIMEOUT_SEC=80
            fi
            if ! python3 scripts/ci/run_headless_smoke.py \
              --scenario "$scenario" \
              --project-root "." \
              --godot-bin "$GODOT_BIN" \
              --timeout-sec "$TIMEOUT_SEC" \
              --hard-timeout-sec "$HARD_TIMEOUT_SEC" \
              --use-xvfb \
              --log-file "$LOG_DIR/smoke.log" \
              --summary-file "$LOG_DIR/smoke_summary.json"; then
              overall=1
            fi
          done
          exit "$overall"

      - name: Upload route logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime_routes_logs
          path: artifacts/runtime_routes
          if-no-files-found: error

  visual_stage:
    needs: static_contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot 4.6.2 headless binary
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Prepare Linux tooling and Godot
        run: bash scripts/ci/bootstrap_linux_godot.sh

      - name: Import project assets once
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit

      - name: Capture stage or full visual QA
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'lean' }}"
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          rm -rf artifacts/visual_qa
          if [ "$PROFILE" = "full" ]; then
            timeout 480s xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path "." --scene res://tools/visual_qa_capture.tscn
            THRESHOLD_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '01_threshold_*.png' | wc -l)
            REGISTRY_TABLE_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '02_registry_*.png' | wc -l)
            PROMISE_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '03_promise_*.png' | wc -l)
            PACT_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '04_pact_??_*.png' | wc -l)
            GESTURE_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '05_gesture_*.png' | wc -l)
            JUDGMENT_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '06_judgment_*.png' | wc -l)
            DOSSIER_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '08_dossier_*.png' | wc -l)
            RECEIPT_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_receipt_*.png' | wc -l)
            MARK_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_mark_*.png' | wc -l)
            INCISION_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_incision_*.png' | wc -l)
            END_RUN_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '08_end_run.png' | wc -l)
            test "$THRESHOLD_COUNT" -eq 24
            test "$REGISTRY_TABLE_COUNT" -eq 24
            test "$PROMISE_COUNT" -eq 30
            test "$PACT_COUNT" -eq 24
            test "$GESTURE_COUNT" -eq 36
            test "$JUDGMENT_COUNT" -eq 30
            test "$DOSSIER_COUNT" -eq 36
            test "$RECEIPT_COUNT" -eq 18
            test "$MARK_COUNT" -eq 18
            test "$INCISION_COUNT" -eq 24
            test "$END_RUN_COUNT" -eq 1
          else
            timeout 240s xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path "." --scene res://tools/visual_qa_capture.tscn -- --section=final_dossier
            DOSSIER_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '08_dossier_*.png' | wc -l)
            TOTAL_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '*.png' | wc -l)
            test "$DOSSIER_COUNT" -eq 36
            test "$TOTAL_COUNT" -eq 36
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual_qa_evidence
          path: |
            artifacts/visual_qa/01_threshold_*.png
            artifacts/visual_qa/02_registry_*.png
            artifacts/visual_qa/02_register_closed.png
            artifacts/visual_qa/03_promise_*.png
            artifacts/visual_qa/03_register_open.png
            artifacts/visual_qa/04_pact_*.png
            artifacts/visual_qa/04_pact_signed.png
            artifacts/visual_qa/05_gesture_*.png
            artifacts/visual_qa/05_intermediate_choice.png
            artifacts/visual_qa/06_judgment_*.png
            artifacts/visual_qa/06_resolve_ritual.png
            artifacts/visual_qa/07_receipt_*.png
            artifacts/visual_qa/07_mark_*.png
            artifacts/visual_qa/07_incision_*.png
            artifacts/visual_qa/07_push_your_luck.png
            artifacts/visual_qa/08_end_run.png
            artifacts/visual_qa/08_dossier_*.png
          if-no-files-found: error
