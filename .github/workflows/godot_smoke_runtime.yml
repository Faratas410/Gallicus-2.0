name: Godot Smoke Runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

env:
  GODOT_VERSION: "4.6.2-stable"
  GODOT_BIN_NAME: "Godot_v4.6.2-stable_linux.x86_64"
  GODOT_ZIP_NAME: "Godot_v4.6.2-stable_linux.x86_64.zip"
  GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"

jobs:
  smoke_runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [BET_PRESENT, FULL_RUN, ROUTE_CASHOUT, ROUTE_DOUBLE, ROUTE_CONDANNA, ROUTE_REGISTER_FINAL]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb git-lfs

      - name: Validate smoke log parser (no Godot)
        run: |
          python3 scripts/ci/test_headless_smoke_validator.py

      - name: Validate active documentation references (no Godot)
        run: |
          python3 scripts/ci/check_docs_active_refs.py

      - name: Validate res:// paths (no Godot)
        run: |
          python3 tools/ci/verify_res_paths.py

      - name: Validate ritual-loop contract (static)
        run: |
          python3 scripts/ci/test_ritual_loop_contract.py

      - name: Validate era visual template anchors (static)
        run: |
          python3 scripts/ci/test_era_visual_template_audit.py

      - name: Validate pressure presentation contract (static)
        run: |
          python3 scripts/ci/test_pressure_presentation_contract.py

      - name: Validate UI motion contract (static)
        run: |
          python3 scripts/ci/test_ui_motion_contract.py

      - name: Validate localization contract (static)
        run: |
          python3 scripts/ci/test_i18n_contract.py

      - name: Validate OF-01 receipt object contract (static)
        run: |
          python3 scripts/ci/test_receipt_object_contract.py

      - name: Validate OF-02 condemnation mark object contract (static)
        run: |
          python3 scripts/ci/test_condemnation_mark_object_contract.py

      - name: Validate OF-03 second incision object contract (static)
        run: |
          python3 scripts/ci/test_second_incision_object_contract.py

      - name: Validate release content baseline (static)
        run: |
          python3 scripts/ci/test_release_content_contract.py

      - name: Validate no mojibake markers (static)
        run: |
          python3 scripts/ci/test_no_mojibake.py

      - name: Cache Godot 4.6.2 headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Git LFS pull
        run: |
          git lfs install
          git lfs pull

      - name: Download Godot 4.6.2 headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          cd tools/godot
          wget -O "$GODOT_ZIP_NAME" "$GODOT_DOWNLOAD_URL"
          unzip -o "$GODOT_ZIP_NAME" "$GODOT_BIN_NAME"
          rm -f "$GODOT_ZIP_NAME"
          chmod +x "$GODOT_BIN_NAME" || true

      - name: Import project assets (headless editor pass)
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LOG_DIR="artifacts/${{ matrix.scenario }}"
          mkdir -p "$LOG_DIR"
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit > "$LOG_DIR/import.log" 2>&1
          tail -n 200 "$LOG_DIR/import.log" || true

      - name: Run scenario smoke
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LOG_DIR="artifacts/${{ matrix.scenario }}"
          mkdir -p "$LOG_DIR"
          if [ "${{ matrix.scenario }}" = "BET_PRESENT" ]; then
            TIMEOUT_SEC=45
            HARD_TIMEOUT_SEC=60
          else
            TIMEOUT_SEC=60
            HARD_TIMEOUT_SEC=80
          fi
          python3 scripts/ci/run_headless_smoke.py \
            --scenario "${{ matrix.scenario }}" \
            --project-root "." \
            --godot-bin "$GODOT_BIN" \
            --timeout-sec "$TIMEOUT_SEC" \
            --hard-timeout-sec "$HARD_TIMEOUT_SEC" \
            --use-xvfb \
            --log-file "$LOG_DIR/smoke.log" \
            --summary-file "$LOG_DIR/smoke_summary.json"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_runtime_${{ matrix.scenario }}
          path: |
            artifacts/${{ matrix.scenario }}
          if-no-files-found: ignore

  visual_qa_object_first_pyl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb git-lfs

      - name: Cache Godot 4.6.2 headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Git LFS pull
        run: |
          git lfs install
          git lfs pull

      - name: Download Godot 4.6.2 headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          cd tools/godot
          wget -O "$GODOT_ZIP_NAME" "$GODOT_DOWNLOAD_URL"
          unzip -o "$GODOT_ZIP_NAME" "$GODOT_BIN_NAME"
          rm -f "$GODOT_ZIP_NAME"
          chmod +x "$GODOT_BIN_NAME" || true

      - name: Import project assets
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit

      - name: Capture object-first push-your-luck visual matrix
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          timeout 180s xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path "." --scene res://tools/visual_qa_capture.tscn
          RECEIPT_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_receipt_*.png' | wc -l)
          MARK_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_mark_*.png' | wc -l)
          INCISION_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_incision_*.png' | wc -l)
          test "$RECEIPT_COUNT" -eq 18
          test "$MARK_COUNT" -eq 18
          test "$INCISION_COUNT" -eq 24

      - name: Upload object-first push-your-luck visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object_first_pyl_visual_qa
          path: |
            artifacts/visual_qa/07_receipt_*.png
            artifacts/visual_qa/07_mark_*.png
            artifacts/visual_qa/07_incision_*.png
            artifacts/visual_qa/07_push_your_luck.png
          if-no-files-found: error
