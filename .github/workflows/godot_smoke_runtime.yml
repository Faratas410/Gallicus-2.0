name: Godot Smoke Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/ci/full_suite_checkpoint.txt"
      - ".github/workflows/godot_smoke_runtime.yml"
      - "project.godot"
      - "scripts/systems/game_events.gd"
      - "scripts/systems/run_manager.gd"
      - "scripts/systems/save_manager.gd"
      - "scripts/systems/run/**"
      - "scripts/contracts/**"

env:
  GODOT_VERSION: "4.6.2-stable"
  GODOT_BIN_NAME: "Godot_v4.6.2-stable_linux.x86_64"
  GODOT_ZIP_NAME: "Godot_v4.6.2-stable_linux.x86_64.zip"
  GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"

jobs:
  static_contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run static contract suite once
        run: |
          set -euo pipefail
          python3 scripts/ci/test_headless_smoke_validator.py
          python3 scripts/ci/check_docs_active_refs.py
          python3 tools/ci/verify_res_paths.py
          python3 scripts/ci/test_ritual_loop_contract.py
          python3 scripts/ci/test_era_visual_template_audit.py
          python3 scripts/ci/test_pressure_presentation_contract.py
          python3 scripts/ci/test_ui_motion_contract.py
          python3 scripts/ci/test_i18n_contract.py
          python3 scripts/ci/test_receipt_object_contract.py
          python3 scripts/ci/test_condemnation_mark_object_contract.py
          python3 scripts/ci/test_second_incision_object_contract.py
          python3 scripts/ci/test_arena_threshold_object_contract.py
          python3 scripts/ci/test_registry_table_object_contract.py
          python3 scripts/ci/test_promise_signature_object_contract.py
          python3 scripts/ci/test_ci_checkpoint_contract.py
          python3 scripts/ci/test_release_content_contract.py
          python3 scripts/ci/test_no_mojibake.py

  smoke_runtime:
    needs: static_contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [BET_PRESENT, FULL_RUN, ROUTE_CASHOUT, ROUTE_DOUBLE, ROUTE_CONDANNA, ROUTE_REGISTER_FINAL]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb

      - name: Cache Godot 4.6.2 headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Download Godot 4.6.2 headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          cd tools/godot
          wget -O "$GODOT_ZIP_NAME" "$GODOT_DOWNLOAD_URL"
          unzip -o "$GODOT_ZIP_NAME" "$GODOT_BIN_NAME"
          rm -f "$GODOT_ZIP_NAME"
          chmod +x "$GODOT_BIN_NAME" || true

      - name: Import project assets
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LOG_DIR="artifacts/${{ matrix.scenario }}"
          mkdir -p "$LOG_DIR"
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit > "$LOG_DIR/import.log" 2>&1
          tail -n 200 "$LOG_DIR/import.log" || true

      - name: Run scenario smoke
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          LOG_DIR="artifacts/${{ matrix.scenario }}"
          mkdir -p "$LOG_DIR"
          if [ "${{ matrix.scenario }}" = "BET_PRESENT" ]; then
            TIMEOUT_SEC=45
            HARD_TIMEOUT_SEC=60
          else
            TIMEOUT_SEC=60
            HARD_TIMEOUT_SEC=80
          fi
          python3 scripts/ci/run_headless_smoke.py \
            --scenario "${{ matrix.scenario }}" \
            --project-root "." \
            --godot-bin "$GODOT_BIN" \
            --timeout-sec "$TIMEOUT_SEC" \
            --hard-timeout-sec "$HARD_TIMEOUT_SEC" \
            --use-xvfb \
            --log-file "$LOG_DIR/smoke.log" \
            --summary-file "$LOG_DIR/smoke_summary.json"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_runtime_${{ matrix.scenario }}
          path: artifacts/${{ matrix.scenario }}
          if-no-files-found: ignore

  visual_qa_object_first:
    needs: static_contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb

      - name: Cache Godot 4.6.2 headless binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_BIN_NAME }}

      - name: Download Godot 4.6.2 headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          cd tools/godot
          wget -O "$GODOT_ZIP_NAME" "$GODOT_DOWNLOAD_URL"
          unzip -o "$GODOT_ZIP_NAME" "$GODOT_BIN_NAME"
          rm -f "$GODOT_ZIP_NAME"
          chmod +x "$GODOT_BIN_NAME" || true

      - name: Import project assets
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          xvfb-run -a "$GODOT_BIN" --headless --editor --path "." --quit

      - name: Capture object-first visual matrix
        run: |
          set -euo pipefail
          GODOT_BIN=./tools/godot/$GODOT_BIN_NAME
          timeout 360s xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path "." --scene res://tools/visual_qa_capture.tscn
          THRESHOLD_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '01_threshold_*.png' | wc -l)
          REGISTRY_TABLE_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '02_registry_*.png' | wc -l)
          PROMISE_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '03_promise_*.png' | wc -l)
          RECEIPT_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_receipt_*.png' | wc -l)
          MARK_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_mark_*.png' | wc -l)
          INCISION_COUNT=$(find artifacts/visual_qa -maxdepth 1 -type f -name '07_incision_*.png' | wc -l)
          test "$THRESHOLD_COUNT" -eq 24
          test "$REGISTRY_TABLE_COUNT" -eq 24
          test "$PROMISE_COUNT" -eq 30
          test "$RECEIPT_COUNT" -eq 18
          test "$MARK_COUNT" -eq 18
          test "$INCISION_COUNT" -eq 24

      - name: Upload object-first visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object_first_visual_qa
          path: |
            artifacts/visual_qa/01_threshold_*.png
            artifacts/visual_qa/02_registry_*.png
            artifacts/visual_qa/02_register_closed.png
            artifacts/visual_qa/03_promise_*.png
            artifacts/visual_qa/03_register_open.png
            artifacts/visual_qa/07_receipt_*.png
            artifacts/visual_qa/07_mark_*.png
            artifacts/visual_qa/07_incision_*.png
            artifacts/visual_qa/07_push_your_luck.png
          if-no-files-found: error
