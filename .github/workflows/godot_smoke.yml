name: Godot Smoke (Headless)

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GALLICUS_PROJECT_ROOT: "."
      GODOT_BIN: ./tools/godot/Godot_v4.6-stable_linux.x86_64
      UI_THEME_OVERRIDE_ALLOWLIST: "theme_override_font_sizes/font_size"
      UI_THEME_RESOURCE_ALLOWLIST: "res://assets/ui/gallicus_ui_theme.tres"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb git-lfs

      - name: Git LFS pull (always)
        run: |
          set -e
          git lfs install
          git lfs pull

      - name: Validate critical PNGs are real binaries
        run: |
          set -e

          check_png () {
            local path="$1"
            local base
            base=$(basename "$path")

            if [ ! -f "$path" ]; then
              echo "ERROR: Missing file: $path"
              echo "find results for $base:"
              find . -type f -iname "$base" -print || true
              exit 1
            fi

            echo "Validating $path"
            ls -lah "$path"
            echo "---- HEAD (3 lines) ----"
            head -n 3 "$path" || true
            echo "---- MAGIC (8 bytes hex) ----"

            local magic
            magic=$(head -c 8 "$path" | xxd -p -c 8 | tr -d '\n')
            echo "$magic"

            if [ "$magic" != "89504e470d0a1a0a" ]; then
              echo "ERROR: $path is not a valid PNG (bad magic)."
              exit 1
            fi

            echo "PNG OK: $path"
          }

          check_png "assets/sprites/weapon_sword.png"
          check_png "assets/sprites/player_chicken.png"
          check_png "UI Official/UI assets (1x).png"

      - name: Verify res:// references (case-sensitive)
        run: |
          set -e
          python tools/ci/verify_res_paths.py --project-root "$GALLICUS_PROJECT_ROOT"

      - name: Enforce global GUI theme authority
        run: |
          set -e
          if ! grep -q '^theme/custom="res://ui/theme/official_theme.tres"$' project.godot; then
            echo "UI governance failure: project.godot must contain theme/custom=\"res://ui/theme/official_theme.tres\" in [gui]."
            exit 1
          fi

      - name: Enforce runtime UI theme governance
        run: |
          set -e
          python tools/ci/scan_ui_theme_overrides.py \
            --project-root "$GALLICUS_PROJECT_ROOT" \
            --allowed-theme-overrides "$UI_THEME_OVERRIDE_ALLOWLIST" \
            --allowed-theme-resources "$UI_THEME_RESOURCE_ALLOWLIST"

      - name: Validate FULL_RUN smoke marker support
        run: |
          set -e
          RUN_MANAGER_FILE="scripts/systems/run_manager.gd"

          has_full_run_scenario=0
          has_full_run_marker_set=0

          if grep -En 'FULL_RUN' "$RUN_MANAGER_FILE" >/dev/null; then
            has_full_run_scenario=1
          fi

          if grep -En 'SMOKE:FINALE_EMITTED|SMOKE:RUN_FINALIZED' "$RUN_MANAGER_FILE" >/dev/null; then
            has_full_run_marker_set=1
          fi

          if [ "$has_full_run_scenario" -ne 1 ] || [ "$has_full_run_marker_set" -ne 1 ]; then
            echo "STOP: FULL_RUN smoke marker set is not fully implemented in current runtime smoke infrastructure."
            echo "Existing SMOKE markers in $RUN_MANAGER_FILE:"
            grep -En 'SMOKE:' "$RUN_MANAGER_FILE" || true
            echo "Furthest explicitly supported smoke scenario in code: BET_PRESENT"
            exit 1
          fi

      - name: Download Godot 4.6 headless
        run: |
          set -e
          mkdir -p tools/godot
          cd tools/godot
          wget -O godot.zip "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x godot* Godot* || true
          ls -la

      - name: Run smoke scenario A (BOOT_ONLY)
        env:
          GALLICUS_SMOKE: "1"
          GALLICUS_SMOKE_TIMEOUT_SEC: "10"
        run: |
          set -e

          xvfb-run -a "$GODOT_BIN" --headless --path "$GALLICUS_PROJECT_ROOT" --quit-after 10 2>&1 | tee smoke_boot.log

          grep -q "SMOKE:BOOT_OK" smoke_boot.log
          grep -q "SMOKE:PHASE=MAIN_MENU" smoke_boot.log

          if grep -E "ERROR|Error" -n smoke_boot.log; then
            echo "Found ERROR in smoke_boot.log"
            tail -n 200 smoke_boot.log
            exit 1
          fi
          if grep -E "WARNING|Warning" -n smoke_boot.log; then
            echo "Found WARNING in smoke_boot.log (warnings = errors)."
            tail -n 200 smoke_boot.log
            exit 1
          fi
          if grep -E "STALL|WATCHDOG|DEAD-END" -n smoke_boot.log; then
            echo "Found stall indicator in smoke_boot.log"
            tail -n 200 smoke_boot.log
            exit 1
          fi

      - name: Run smoke scenario B (NEW_RUN_TO_BET_PRESENT)
        env:
          GALLICUS_SMOKE: "1"
          GALLICUS_SMOKE_TRIGGER_NEW_RUN: "1"
          GALLICUS_SMOKE_SCENARIO: "BET_PRESENT"
          GALLICUS_SMOKE_TIMEOUT_SEC: "10"
        run: |
          set -e

          xvfb-run -a "$GODOT_BIN" --headless --path "$GALLICUS_PROJECT_ROOT" --quit-after 10 2>&1 | tee smoke_betpresent.log

          grep -q "SMOKE:NEW_RUN_REQUESTED" smoke_betpresent.log
          grep -q "SMOKE:PHASE=RUN_INIT" smoke_betpresent.log
          grep -q "SMOKE:PHASE=BET_PRESENT" smoke_betpresent.log

          if grep -E "ERROR|Error" -n smoke_betpresent.log; then
            echo "Found ERROR in smoke_betpresent.log"
            tail -n 200 smoke_betpresent.log
            exit 1
          fi
          if grep -E "WARNING|Warning" -n smoke_betpresent.log; then
            echo "Found WARNING in smoke_betpresent.log (warnings = errors)."
            tail -n 200 smoke_betpresent.log
            exit 1
          fi
          if grep -E "STALL|WATCHDOG|DEAD-END" -n smoke_betpresent.log; then
            echo "Found stall indicator in smoke_betpresent.log"
            tail -n 200 smoke_betpresent.log
            exit 1
          fi

      - name: Run smoke scenario C (FULL_RUN_TO_GAME_OVER)
        env:
          GALLICUS_SMOKE: "1"
          GALLICUS_SMOKE_TRIGGER_NEW_RUN: "1"
          GALLICUS_SMOKE_SCENARIO: "FULL_RUN"
          GALLICUS_SMOKE_TIMEOUT_SEC: "60"
        run: |
          set -e

          xvfb-run -a "$GODOT_BIN" --headless --path "$GALLICUS_PROJECT_ROOT" --quit-after 60 2>&1 | tee smoke_fullrun.log

          grep -q "SMOKE:PHASE=INTERMEDIATE_CHOICE" smoke_fullrun.log
          grep -q "SMOKE:PHASE=PUSH_YOUR_LUCK" smoke_fullrun.log
          grep -q "SMOKE:PHASE=GAME_OVER" smoke_fullrun.log

          if ! grep -Eq "SMOKE:FINALE_EMITTED|SMOKE:RUN_FINALIZED" smoke_fullrun.log; then
            echo "STOP: FULL_RUN completed without known finale marker (SMOKE:FINALE_EMITTED or SMOKE:RUN_FINALIZED)."
            echo "Existing SMOKE markers seen in smoke_fullrun.log:"
            grep -En "SMOKE:" smoke_fullrun.log || true
            tail -n 200 smoke_fullrun.log
            exit 1
          fi

          if grep -E "ERROR|Error" -n smoke_fullrun.log; then
            echo "Found ERROR in smoke_fullrun.log"
            tail -n 200 smoke_fullrun.log
            exit 1
          fi
          if grep -E "WARNING|Warning" -n smoke_fullrun.log; then
            echo "Found WARNING in smoke_fullrun.log (warnings = errors)."
            tail -n 200 smoke_fullrun.log
            exit 1
          fi
          if grep -E "STALL|WATCHDOG|DEAD-END" -n smoke_fullrun.log; then
            echo "Found stall indicator in smoke_fullrun.log"
            tail -n 200 smoke_fullrun.log
            exit 1
          fi

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-logs
          if-no-files-found: warn
          path: |
            smoke_boot.log
            smoke_betpresent.log
            smoke_fullrun.log

      - name: Upload runtime user/log directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-logs
          if-no-files-found: warn
          path: |
            logs/**
            .godot/**/logs/**
            .local/share/godot/app_userdata/**/logs/**
