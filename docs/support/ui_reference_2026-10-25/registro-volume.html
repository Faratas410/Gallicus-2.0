  <div class="motion-controls">
    <button type="button" id="reg-play">Riproduci</button>
    <button type="button" id="reg-restart">Ricomincia</button>

<style>
#registro-motion{width:100%;color:#eadfc8;font:14px/1.4 system-ui,sans-serif;background:#211a18}
#registro-motion canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#registro-motion .motion-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;background:#211a18}
#registro-motion button{font:inherit;color:#eadfc8;background:#382b25;border:1px solid #846343;padding:9px 14px;border-radius:3px;min-height:42px}
#registro-motion button:focus-visible,#registro-motion input:focus-visible{outline:2px solid #f2d79b;outline-offset:3px}
#registro-motion .motion-seek{display:flex;gap:9px;align-items:center;flex:1;min-width:160px}
#registro-motion input{min-width:80px;width:100%;accent-color:#bd8f4d}
#registro-motion output{font-variant-numeric:tabular-nums;min-width:80px}
#registro-motion #reg-phase{width:100%;color:#d7bb8a}
@media(max-width:480px){#registro-motion .motion-controls{gap:8px;padding:10px}#registro-motion .motion-seek{order:3;flex-basis:100%}#registro-motion #reg-phase{order:4}}
</style>

const imgs={};
function isolateBook(){
 const layer=document.createElement('canvas');layer.width=1620;layer.height=972;
 const g=layer.getContext('2d');g.imageSmoothingEnabled=false;
 // Follow the leather and bronze silhouette; never move a rectangle of scenery.
 const edge=[[155,151],[1467,151],[1475,207],[1469,207],
 [1520,665],[1543,665],[1550,728],[1536,728],[1547,800],
 [1565,801],[1578,881],[1565,902],[866,916],[812,921],
 [755,915],[60,904],[45,885],[50,802],[66,800],[76,728],
 [69,728],[79,668],[95,667],[145,210],[147,210]];
 g.beginPath();edge.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.clip();
 g.drawImage(imgs.open,0,0,1620,972);imgs.book=layer;
}
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,k)=>a+(b-a)*k;
let t=0,running=false,loaded=false,previous=0,phaseName='',raf=0;
const strokes=[
 [[414,703],[430,687],[451,654],[463,649],[457,670],[445,701],[431,717],[428,706],[445,686],[467,679],[487,680],[493,687],[485,699],[468,704],[458,702]],
 [[485,704],[504,675],[500,701],[518,681],[514,703],[531,682],[527,702],[545,685],[541,702],[558,688],[563,696],[582,685],[592,689]],
 [[431,718],[468,713],[512,713],[554,711],[592,706],[615,700],[623,698]]
];
const segments=[];let length=0;
strokes.forEach(s=>s.slice(1).forEach((p,i)=>{const a=s[i],len=Math.hypot(p[0]-a[0],p[1]-a[1]);segments.push({a,b:p,len,start:length});length+=len}));
function ink(progress){
 const target=length*clamp(progress);let tip=segments[0].a;
 ctx.save();ctx.strokeStyle='#4b2c1b';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
 for(const s of segments){if(target<s.start)break;const k=Math.min(1,(target-s.start)/s.len);tip=[mix(s.a[0],s.b[0],k),mix(s.a[1],s.b[1],k)];ctx.beginPath();ctx.moveTo(Math.round(s.a[0]/2)*2,Math.round(s.a[1]/2)*2);ctx.lineTo(Math.round(tip[0]/2)*2,Math.round(tip[1]/2)*2);ctx.stroke();if(k<1)break}
 ctx.restore();return tip;
}
function pen(x,y,alpha=1,angle=0){
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);
 ctx.drawImage(imgs.sprites,878,355,610,380,0,-139,224,140);
 ctx.restore();
}
function project(x,y,z){const s=6800/(6800-z);return [810+(x-810)*s,520+(y-520)*s]}
function triangle(image,src,d,second){
 const s=second?[[0,0],[src.w,src.h],[0,src.h]]:[[0,0],[src.w,0],[src.w,src.h]];
 const [a,b,c]=s,[p,q,r]=d,den=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);
 if(Math.abs(den)<.001)return;
 const ax=((q[0]-p[0])*(c[1]-a[1])-(r[0]-p[0])*(b[1]-a[1]))/den;
 const ay=((q[1]-p[1])*(c[1]-a[1])-(r[1]-p[1])*(b[1]-a[1]))/den;
 const bx=((r[0]-p[0])*(b[0]-a[0])-(q[0]-p[0])*(c[0]-a[0]))/den;
 const by=((r[1]-p[1])*(b[0]-a[0])-(q[1]-p[1])*(c[0]-a[0]))/den;
 const center=[(p[0]+q[0]+r[0])/3,(p[1]+q[1]+r[1])/3];
 const expanded=d.map(v=>{const dx=v[0]-center[0],dy=v[1]-center[1],len=Math.hypot(dx,dy)||1;return [v[0]+dx/len*.9,v[1]+dy/len*.9]});
 ctx.save();ctx.beginPath();expanded.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.clip();
 ctx.transform(ax,ay,bx,by,p[0],p[1]);ctx.drawImage(image,-src.x,-src.y);ctx.restore();
}
function surface(image,src,point,columns=64){
 const vertical=Math.abs(point(.3,0)[0]-point(.3,1)[0])<.01;
 if(vertical)columns=Math.max(columns,355);
 for(let i=0;i<columns;i++){
  const u=i/columns,v=(i+1)/columns;
  const p=point(u,0),q=point(v,0),r=point(v,1),s=point(u,1);
  const crop={x:src.x+u*src.w,y:src.y,w:src.w/columns,h:src.h};
  if(vertical){
   const top=point((u+v)/2,0),bottom=point((u+v)/2,1),width=Math.abs(q[0]-p[0]);
   if(width>.001)ctx.drawImage(image,crop.x,crop.y,crop.w,crop.h,Math.min(p[0],q[0])-.4,top[1],width+.8,bottom[1]-top[1]);
   continue;
  }
  triangle(image,crop,[p,q,r],false);triangle(image,crop,[p,r,s],true);
 }
}
function openingBook(k){
 const angle=k*Math.PI,hinge=mix(427,810,k),w=768,h=778,top=145;
 const sin=Math.sin(angle),cos=Math.cos(angle),depth=16;
 // The stationary page block has thickness even before the front cover turns.
 ctx.drawImage(imgs.book,810,145,768,778,hinge,145,768,778);
 const cast=sin*.22;
 if(cast>0){ctx.save();ctx.globalAlpha=cast;const shade=ctx.createLinearGradient(hinge,0,hinge+220*sin,0);shade.addColorStop(0,'#28180f');shade.addColorStop(1,'rgba(40,24,15,0)');ctx.fillStyle=shade;ctx.fillRect(hinge,155,220*sin,750);ctx.restore()}
 const pose=(u,v,z)=>project(hinge+cos*u*w-sin*z,top+v*h,sin*u*w+cos*z);
 // Only the leather board rotates here. Sampling the open page face for its
 // edge stretched pale parchment into a dangling flap at the turn.
 // Keep the rim inside the opaque cover's top/bottom silhouette; the thick
 // paper block remains on the stationary half and on the revealed left page.
 ctx.save();ctx.globalAlpha=clamp((cos+.15)/.25);
 surface(imgs.sprites,{x:285,y:883,w:310,h:14},(u,v)=>pose(.025+u*.95,.982,v*depth),40);
 surface(imgs.sprites,{x:705,y:440,w:15,h:320},(u,v)=>pose(.982,.025+v*.95,u*depth),8);
 ctx.restore();
 if(cos>=0){
  surface(imgs.sprites,{x:110,y:80,w:665,h:850},(u,v)=>pose(u,v,depth),72);
 }else{
  surface(imgs.book,{x:44,y:145,w:766,h:778},(u,v)=>{
   const flex=Math.sin(u*Math.PI)*sin*19;
   return project(hinge+cos*(1-u)*766,top+v*h+flex*(v-.5),sin*(1-u)*766+flex);
  },72);
 }
}
function draw(){
 if(!loaded)return;
 ctx.imageSmoothingEnabled=false;
 ctx.globalAlpha=1;ctx.drawImage(imgs.back,0,0,1620,972);
 const opening=ease((t-0.8)/3.1);
 if(t<3.9){
  openingBook(opening);
 }else{
  const settle=t<4.5?Math.sin((t-3.9)*Math.PI/.6)*2:0;
  ctx.drawImage(imgs.book,0,settle,1620,972);
 }
 // One background stays in place throughout; no full-scene crossfade at landing.
 if(t>4.8){
  ctx.save();ctx.translate(0,-28);
  const approach=ease((t-4.8)/1.2),writing=clamp((t-6.6)/2.8);
  if(t<6.6){const x=mix(138,414,approach),y=mix(558,703,approach);pen(x,y,approach,Math.sin(approach*Math.PI)*-.12)}
  else{const tip=ink(writing);if(t<9.4)pen(tip[0],tip[1],1,Math.sin(writing*26)*.018);else{const lift=ease((t-9.4)/.9);pen(mix(tip[0],690,lift),mix(tip[1],615,lift),1-lift,-lift*.2)}}
  ctx.restore();
 }
 const name=t<.8?'Libro chiuso':t<3.9?'Apertura del volume':t<4.8?'Le pagine si assestano':t<6.6?'Via della Prudenza in focus':t<9.4?'Sottoscrizione a inchiostro':'Firma registrata';
 if(phaseName!==name){phaseName=name;phase.textContent=name}
 seek.value=String(t);time.textContent=t.toFixed(1).replace('.',',')+' / 12 s';
 play.textContent=running?'Pausa':t>=12?'Rivedi':'Riproduci';
 canvas.setAttribute('aria-label','Registro: '+name+'. Promessa selezionata: Via della Prudenza.');
}
function stop(){running=false;cancelAnimationFrame(raf)}
function tick(now){if(!running)return; if(previous)t=Math.min(12,t+(now-previous)/1000);previous=now;if(t>=12)running=false;draw();if(running)raf=requestAnimationFrame(tick)}
function start(){if(!loaded)return;cancelAnimationFrame(raf);if(t>=12)t=0;running=true;previous=0;draw();raf=requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(running){stop();draw()}else start()});
restart.addEventListener('click',()=>{stop();t=0;draw();start()});
seek.addEventListener('input',()=>{stop();t=Number(seek.value);draw()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();draw()}});
Promise.all(Object.entries(urls).map(([k,v])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{imgs[k]=im;resolve()};im.onerror=reject;im.src=v}))).then(()=>{isolateBook();loaded=true;draw();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)start()}).catch(()=>{phase.textContent='Impossibile caricare le immagini.';play.disabled=true;restart.disabled=true});
})();
</script>
